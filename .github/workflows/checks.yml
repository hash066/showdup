name: Check ShowdUp
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: npm ci
        working-directory: functions
      - run: npm test
        working-directory: functions
      - run: npx firebase-tools emulators:exec --only firestore --project demo-showdup "npm --prefix functions run test:rules"
      - run: flutter build apk --debug
