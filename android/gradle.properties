org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Kotlin's relocatable incremental cache breaks when Flutter plugins live on C:
# and this project is on E:\. A clean non-incremental compile is slower but
# deterministic and avoids noisy daemon fallback failures in release builds.
kotlin.incremental=false
