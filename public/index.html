<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="ShowdUp privacy and support information.">
  <title>ShowdUp</title>
  <style>
    :root { color-scheme: dark; --ink:#f7f1e8; --muted:#aeb8d1; --accent:#ff8a4c; --bg:#0d1426; --card:#17213d; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.65 system-ui,sans-serif; }
    main { max-width:760px; margin:auto; min-height:100vh; padding:64px 24px; display:grid; align-content:center; }
    .brand { display:flex; align-items:center; gap:14px; font-size:30px; font-weight:800; }
    .mark { width:48px; height:48px; border-radius:14px; background:var(--accent); color:var(--bg); display:grid; place-items:center; }
    h1 { max-width:620px; margin:52px 0 18px; font-size:clamp(42px,8vw,72px); line-height:1.02; letter-spacing:-.04em; }
    p { color:var(--muted); max-width:620px; }
    a { color:var(--accent); }
    .button { display:inline-block; margin-top:22px; padding:14px 20px; border-radius:14px; background:var(--accent); color:var(--bg); text-decoration:none; font-weight:750; }
  </style>
</head>
<body><main>
  <div class="brand"><span class="mark">✓</span>ShowdUp</div>
  <h1>Keep the promise you made to yourself.</h1>
  <p>ShowdUp is a local-first Android accountability app. Commitments and verification evidence stay on your device; optional Battles sync only identity, membership and aggregated scores.</p>
  <p><a class="button" href="/privacy/">Read the privacy policy</a></p>
</main></body>
</html>
