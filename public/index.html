<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="ShowdUp: an alarm you have to show up for. Privacy, support and data deletion.">
  <title>ShowdUp</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700&display=swap">
  <style>
    :root { color-scheme: dark; --ink:#0E0E0C; --carbon:#171714; --line:#262622; --paper:#F2EEE6; --stone:#8F8A80; --mint:#5CF0BE; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--ink); color:var(--paper); font:16px/1.6 'Bricolage Grotesque', system-ui, sans-serif; }
    main { max-width:760px; margin:auto; min-height:100vh; padding:64px 24px; display:grid; align-content:center; }
    .brand { display:flex; align-items:center; gap:12px; font-size:24px; font-weight:700; letter-spacing:-.02em; }
    h1 { max-width:620px; margin:44px 0 16px; font-size:clamp(40px,8vw,64px); line-height:1.02; letter-spacing:-.04em; font-weight:700; }
    p { color:var(--stone); max-width:620px; }
    a { color:var(--paper); }
    .links { display:flex; flex-wrap:wrap; gap:12px; margin-top:28px; }
    .button { display:inline-block; padding:15px 20px; border-radius:16px; background:var(--mint); color:var(--ink); text-decoration:none; font-weight:700; }
    .quiet { display:inline-block; padding:15px 20px; border-radius:16px; border:1px solid #3A3A34; color:var(--paper); text-decoration:none; font-weight:500; }
  </style>
</head>
<body><main>
  <div class="brand">
    <svg width="34" height="34" viewBox="0 0 96 96" aria-hidden="true">
      <path d="M28 46V56a20 20 0 0 0 40 0V46" fill="none" stroke="#F2EEE6" stroke-width="11" stroke-linecap="round"></path>
      <circle cx="48" cy="26" r="10" fill="#5CF0BE"></circle>
    </svg>
    ShowdUp
  </div>
  <h1>An alarm you have to show up for.</h1>
  <p>It rings until your phone can tell you showed up: steps walked, phone left alone, a tag scanned, a place reached. Alarms, history and proof stay on your phone. Battles sync only a name, a companion and weekly scores.</p>
  <div class="links">
    <a class="button" href="/privacy/">Privacy policy</a>
    <a class="quiet" href="/delete-account/">Delete your data</a>
  </div>
</main></body>
</html>
